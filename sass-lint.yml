options:
  formatter: stylish
  merge-default-rules: false

files:
  include: 'web/assets/scss/**/*.scss'
  ignore:
    - 'web/assets/scss/theme/_theme-vars.scss'

rules:
  # Basis leesbaarheid/consistentie
  indentation:
    - 1
    - size: 4
  no-duplicate-properties: 1
  no-empty-rulesets: 1
  no-important: 1
  no-trailing-whitespace: 1
  no-trailing-zero: 1
  space-after-colon: 1
  space-before-brace: 1
  brace-style:
    - 1
    - style: 1tbs

  # Uitgeschakeld: te streng / niet compatibel met moderne CSS
  # (clamp(), CSS custom properties, calc(), vw/vh-eenheden in shorthand
  # properties zoals gap/padding worden anders als "invalid property value"
  # gemarkeerd terwijl ze geldige, correcte CSS zijn).
  property-units: 0
  no-color-literals: 0
  hex-length: 0
  hex-notation: 0
  variable-name-format: 0
  class-name-format: 0
  placeholder-name-format: 0
  no-css-comments: 0
  force-element-nesting: 0
  no-qualifying-elements: 0
  nesting-depth: 0
  selector-format: 0
